<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control SAP Logística</title>
    <!-- Ícono del sitio -->
  <link rel="icon" type="image/png" href="favicon.png">
    <!-- Font Awesome para los íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
   :root {
            --bg-app: #0b1220;
            --bg-sidebar: #0f1729;
            --bg-sidebar-2: #131d33;
            --bg-card: #ffffff;
            --bg-main: #eef1f6;
            --accent: #2dd4bf;
            --accent-soft: rgba(45, 212, 191, 0.12);
            --accent-amber: #f59e0b;
            --text-primary: #e7ecf5;
            --text-muted: #8694ab;
            --text-dark: #1a2236;
            --border-soft: rgba(255,255,255,0.07);
            --shadow-deep: 0 20px 40px -12px rgba(5, 10, 25, 0.55);
            --radius-lg: 16px;
            --radius-md: 10px;
        }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
        font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        height: 100vh;
        overflow: hidden;
        background-color: var(--bg-app);
        color: var(--text-primary);
    }

    /* ===== SIDEBAR SAP ===== */
    .sidebar {
        width: 290px;
        min-width: 290px;
        background: linear-gradient(180deg, var(--bg-sidebar) 0%, var(--bg-sidebar-2) 100%);
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--border-soft);
        transition: margin-left 0.35s cubic-bezier(.4,0,.2,1), box-shadow 0.35s ease;
        position: relative;
        z-index: 30;
    }

    .sidebar-header {
        padding: 22px 22px 20px 22px;
        border-bottom: 1px solid var(--border-soft);
        display: flex;
        align-items: center;
        gap: 14px;
    }
    .logo-mark {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--accent) 0%, #0ea5a3 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        color: #04211f;
        flex-shrink: 0;
        box-shadow: 0 6px 16px -4px rgba(45, 212, 191, 0.5);
    }
    .logo-text { line-height: 1.25; }
    .logo-text .title {
        font-size: 14.5px;
        font-weight: 700;
        letter-spacing: 0.3px;
        color: #fff;
    }
    .logo-text .subtitle {
        font-size: 11px;
        color: var(--text-muted);
        letter-spacing: 0.4px;
        text-transform: uppercase;
    }

    .status-bar {
        margin: 16px 22px 6px 22px;
        padding: 10px 14px;
        background: rgba(45, 212, 191, 0.08);
        border: 1px solid rgba(45, 212, 191, 0.18);
        border-radius: var(--radius-md);
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12.5px;
        color: #b9f3ea;
    }
    .pulse-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 0 rgba(45, 212, 191, 0.7);
        animation: pulse 2s infinite;
        flex-shrink: 0;
    }
    @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(45, 212, 191, 0.55); }
        70% { box-shadow: 0 0 0 7px rgba(45, 212, 191, 0); }
        100% { box-shadow: 0 0 0 0 rgba(45, 212, 191, 0); }
    }

    .menu-section-label {
        margin: 22px 26px 8px 26px;
        font-size: 10.5px;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        color: var(--text-muted);
        font-weight: 600;
    }

    .menu-options {
        flex-grow: 1;
        padding: 4px 16px 16px 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        overflow-y: auto;
    }

    .menu-btn {
        position: relative;
        background: transparent;
        border: 1px solid transparent;
        color: var(--text-muted);
        padding: 13px 14px;
        text-align: left;
        font-size: 13.5px;
        font-weight: 500;
        cursor: pointer;
        border-radius: var(--radius-md);
        transition: all 0.25s ease;
        width: 100%;
        display: flex;
        align-items: center;
        gap: 13px;
        overflow: hidden;
    }
    .menu-btn .icon-wrap {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: rgba(255,255,255,0.04);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        color: var(--text-muted);
        transition: all 0.25s ease;
        flex-shrink: 0;
    }
    .menu-btn span.label { white-space: nowrap; }
    .menu-btn::before {
        content: "";
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 3px;
        background: var(--accent);
        transform: scaleY(0);
        transition: transform 0.25s ease;
        border-radius: 0 4px 4px 0;
    }
    .menu-btn:hover {
        background-color: rgba(255,255,255,0.05);
        color: #fff;
        transform: translateX(2px);
    }
    .menu-btn:hover .icon-wrap {
        background: rgba(255,255,255,0.08);
        color: #fff;
    }
    .menu-btn.active {
        background: linear-gradient(90deg, var(--accent-soft) 0%, rgba(45,212,191,0.02) 100%);
        color: #fff;
        font-weight: 600;
        border-color: rgba(45, 212, 191, 0.25);
    }
    .menu-btn.active::before { transform: scaleY(1); }
    .menu-btn.active .icon-wrap {
        background: var(--accent);
        color: #04211f;
        box-shadow: 0 4px 12px -2px rgba(45, 212, 191, 0.55);
    }

    .sidebar-footer {
        padding: 16px 22px;
        border-top: 1px solid var(--border-soft);
        font-size: 11px;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .sidebar-footer .ver-tag {
        background: rgba(255,255,255,0.06);
        padding: 3px 8px;
        border-radius: 6px;
        font-weight: 600;
        letter-spacing: 0.3px;
    }

    /* ===== MAIN CONTENT ===== */
    .main-content {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        height: 100%;
        background: var(--bg-main);
        min-width: 0;
    }

    .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 28px;
        background: var(--bg-card);
        border-bottom: 1px solid #e3e8f0;
        gap: 16px;
    }
    .topbar-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .hamburger {
        display: none;
        background: var(--bg-main);
        border: 1px solid #dde3ee;
        width: 38px;
        height: 38px;
        border-radius: 10px;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: var(--text-dark);
        font-size: 15px;
        flex-shrink: 0;
        transition: all 0.2s ease;
    }
    .hamburger:hover { background: #e2e8f5; }
    .topbar-title {
        font-size: 15px;
        font-weight: 700;
        color: var(--text-dark);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .topbar-sub {
        font-size: 12px;
        color: #97a2b8;
        margin-top: 2px;
    }
    .topbar-right {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
    }
    .refresh-btn {
        background: var(--accent-soft);
        color: #0d7a72;
        border: 1px solid rgba(45,212,191,0.3);
        padding: 9px 14px;
        border-radius: 9px;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 7px;
        transition: all 0.2s ease;
    }
    .refresh-btn:hover { background: rgba(45,212,191,0.22); }
    .refresh-btn i { transition: transform 0.5s ease; }
    .refresh-btn.spinning i { animation: spin 0.6s linear; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .frame-area {
        flex-grow: 1;
        padding: 20px 28px 28px 28px;
        min-height: 0;
        display: flex;
        position: relative;
    }
    .frame-card {
        position: relative;
        flex-grow: 1;
        background: var(--bg-card);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-deep);
        overflow: hidden;
        border: 1px solid #e3e8f0;
    }
    
    .app-frame {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: none;
        background: white;
        display: none;
    }
    .app-frame.active { display: block; }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(255,255,255,0.92);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
        z-index: 10;
    }
    .loading-overlay.show { opacity: 1; pointer-events: all; }
    .spinner {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 4px solid #dfe6f0;
        border-top-color: var(--accent);
        animation: rotate 0.8s linear infinite;
    }
    @keyframes rotate { to { transform: rotate(360deg); } }
    .loading-text {
        font-size: 12.5px;
        color: var(--text-muted);
        font-weight: 600;
        letter-spacing: 0.3px;
    }
    .progress-track {
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 3px;
        background: transparent;
        z-index: 11;
        overflow: hidden;
    }
    .progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--accent), var(--accent-amber));
        transition: width 0.3s ease;
    }
    .progress-bar.loading { animation: loadbar 0.9s ease forwards; }
    @keyframes loadbar {
        0% { width: 0%; }
        60% { width: 75%; }
        100% { width: 100%; }
    }

    .backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(5,10,25,0.5);
        z-index: 20;
        opacity: 0;
        transition: opacity 0.3s ease;
    }
    .backdrop.show { display: block; opacity: 1; }

    /* ===== PANEL MICROSOFT TO-DO (DRAWER LATERAL) ===== */
    .notes-drawer {
        position: fixed;
        top: 0; right: -420px; bottom: 0;
        width: 420px;
        background: var(--bg-sidebar-2);
        border-left: 1px solid var(--border-soft);
        z-index: 40;
        display: flex;
        flex-direction: column;
        transition: right 0.3s cubic-bezier(.4,0,.2,1);
        box-shadow: var(--shadow-deep);
    }
    .notes-drawer.open { right: 0; }
    
    .todo-drawer-header {
        padding: 20px 20px 14px 20px;
        border-bottom: 1px solid var(--border-soft);
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .todo-header-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .todo-header-top h3 { font-size: 15px; font-weight: 600; color: #fff; display: flex; align-items: center; gap: 8px; }
    .close-notes-btn {
        background: transparent; border: none; color: var(--text-muted);
        cursor: pointer; font-size: 16px; transition: color 0.2s;
    }
    .close-notes-btn:hover { color: #fff; }

    /* Pestañas de listas estilo To Do */
    .todo-nav-tabs {
        display: flex;
        gap: 6px;
    }
    .todo-tab-btn {
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--border-soft);
        color: var(--text-muted);
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 11.5px;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .todo-tab-btn.active {
        background: var(--accent-soft);
        color: var(--accent);
        border-color: rgba(45, 212, 191, 0.3);
        font-weight: 600;
    }

    .notes-body { flex-grow: 1; padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
    
    .todo-add-box {
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid var(--border-soft);
        border-radius: var(--radius-md);
        padding: 10px 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .todo-input-row {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .todo-main-input {
        flex-grow: 1;
        background: transparent;
        border: none;
        color: #fff;
        font-size: 13px;
        outline: none;
    }
    .todo-main-input::placeholder { color: var(--text-muted); }
    
    .todo-add-btn-mini {
        background: var(--accent);
        color: #04211f;
        border: none;
        width: 30px;
        height: 30px;
        border-radius: 6px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        transition: opacity 0.2s;
    }
    .todo-add-btn-mini:hover { opacity: 0.9; }

    .todo-meta-options {
        display: flex;
        align-items: center;
        gap: 10px;
        border-top: 1px solid var(--border-soft);
        padding-top: 8px;
    }
    .todo-meta-input {
        background: rgba(255,255,255,0.06);
        border: 1px solid var(--border-soft);
        color: #fff;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 11px;
        outline-color: var(--accent);
        color-scheme: dark;
    }

    /* Listado de tareas */
    .todo-list-container {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .todo-task-item {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border-soft);
        border-radius: var(--radius-md);
        padding: 12px;
        display: flex;
        align-items: flex-start;
        gap: 12px;
        transition: all 0.2s ease;
    }
    .todo-task-item:hover { background: rgba(255, 255, 255, 0.06); }
    .todo-task-item.completed { opacity: 0.45; }
    .todo-task-item.completed .todo-text-span { text-decoration: line-through; color: var(--text-muted); }
    .todo-task-item.important { border-left: 3px solid var(--accent-amber); }

    .todo-checkbox-custom {
        width: 18px;
        height: 18px;
        border-radius: 4px;
        border: 2px solid var(--text-muted);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
        margin-top: 2px;
        transition: all 0.2s;
    }
    .todo-task-item.completed .todo-checkbox-custom {
        background: var(--accent);
        border-color: var(--accent);
        color: #04211f;
    }
    .todo-checkbox-custom i { font-size: 10px; display: none; }
    .todo-task-item.completed .todo-checkbox-custom i { display: block; }

    .todo-content-box { flex-grow: 1; display: flex; flex-direction: column; gap: 4px; }
    .todo-text-span { font-size: 13px; color: #fff; word-break: break-word; cursor: pointer; }
    
    .todo-task-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        font-size: 10.5px;
        color: var(--text-muted);
    }
    .task-badge {
        background: rgba(255,255,255,0.06);
        padding: 2px 6px;
        border-radius: 4px;
        display: flex;
        align-items: center;
        gap: 4px;
    }
    .task-badge.alarm-due {
        background: rgba(245, 158, 11, 0.15);
        color: var(--accent-amber);
        border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .todo-task-actions { display: flex; gap: 8px; align-items: center; }
    .todo-action-icon {
        background: transparent; border: none; color: var(--text-muted);
        cursor: pointer; font-size: 13px; transition: color 0.2s;
    }
    .todo-action-icon.star.active { color: var(--accent-amber); }
    .todo-action-icon:hover { color: #fff; }
    .todo-action-icon.delete:hover { color: #f87171; }

    /* ===== BANNER SUPERIOR DE NOTIFICACIÓN ESTILO MENSAJE FLOTANTE ===== */
    .top-notification-container {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 99999;
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 90%;
        max-width: 480px;
        pointer-events: none;
    }
    .banner-alert {
        background: #131d33;
        border: 1px solid var(--accent-amber);
        border-top: 4px solid var(--accent-amber);
        color: #fff;
        padding: 14px 18px;
        border-radius: 12px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        gap: 14px;
        pointer-events: auto;
        animation: slideDownBanner 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes slideDownBanner {
        from { opacity: 0; transform: translateY(-30px) scale(0.95); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .banner-alert.fade-out {
        animation: fadeOutBanner 0.3s ease forwards;
    }
    @keyframes fadeOutBanner {
        to { opacity: 0; transform: translateY(-20px) scale(0.95); }
    }
    .banner-icon {
        background: rgba(245, 158, 11, 0.15);
        color: var(--accent-amber);
        width: 38px; height: 38px;
        border-radius: 10px;
        display: flex; align-items: center; justify-content: center;
        font-size: 18px; flex-shrink: 0;
    }
    .banner-content {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        gap: 3px;
    }
    .banner-title {
        font-size: 12px;
        font-weight: 700;
        color: var(--accent-amber);
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .banner-msg {
        font-size: 13px;
        color: #e7ecf5;
        line-height: 1.35;
        word-break: break-word;
    }
    .banner-actions {
        display: flex;
        gap: 6px;
        flex-shrink: 0;
    }
    .banner-btn-action {
        background: rgba(255,255,255,0.08);
        border: 1px solid var(--border-soft);
        color: #fff;
        padding: 6px 10px;
        border-radius: 6px;
        font-size: 11.5px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 4px;
        white-space: nowrap;
    }
    .banner-btn-action:hover { background: rgba(255,255,255,0.15); }
    .banner-btn-action.delete-btn { color: #f87171; border-color: rgba(248, 113, 113, 0.3); }
    .banner-btn-action.delete-btn:hover { background: rgba(248, 113, 113, 0.15); }

    .floating-notes-trigger {
        position: fixed; bottom: 24px; right: 24px;
        width: 50px; height: 50px; border-radius: 50%;
        background: linear-gradient(135deg, var(--accent) 0%, #0ea5a3 100%);
        color: #04211f; display: flex; align-items: center; justify-content: center;
        font-size: 18px; cursor: pointer; z-index: 35; border: none;
        box-shadow: 0 6px 20px rgba(45, 212, 191, 0.4); transition: transform 0.2s, box-shadow 0.2s;
    }
    .floating-notes-trigger:hover {
        transform: scale(1.05); box-shadow: 0 8px 24px rgba(45, 212, 191, 0.5);
    }

    @media (max-width: 880px) {
        .sidebar {
            position: fixed; top: 0; bottom: 0; left: 0; margin-left: -290px; box-shadow: none;
        }
        .sidebar.open {
            margin-left: 0; box-shadow: 16px 0 40px rgba(0,0,0,0.35);
        }
        .hamburger { display: flex; }
        .frame-area { padding: 14px; }
        .topbar { padding: 14px 16px; }
        .topbar-sub { display: none; }
        .notes-drawer { width: 100%; right: -100%; }
        .top-notification-container { width: 95%; top: 10px; }
    }
</style>
</head>
<body>

    <div class="backdrop" id="backdrop" onclick="cerrarTodo()"></div>

    <!-- Contenedor superior para el mensaje de notificación flotante con botones de Borrar o Cerrar -->
    <div class="top-notification-container" id="topNotificationContainer"></div>

    <!-- SIDEBAR SAP -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo-mark"><i class="fa-solid fa-truck-fast"></i></div>
            <div class="logo-text">
                <div class="title">CENTRAL DE HERRAMIENTAS</div>
                <div class="subtitle">SAP · Logística</div>
            </div>
        </div>

        <div class="status-bar">
            <span class="pulse-dot"></span>
            Usuario en línea · Sesión activa
        </div>

        <div class="menu-section-label">Procesos</div>
        <div class="menu-options">
            <button class="menu-btn active" onclick="cargarApp(this, 'frame1', 'https://lautinax.github.io/va05/')">
                <span class="icon-wrap"><i class="fa-solid fa-box-archive"></i></span>
                <span class="label">Para enviar a back office</span>
            </button>
            <button class="menu-btn" onclick="cargarApp(this, 'frame2', 'https://lautinax.github.io/descuento/')">
                <span class="icon-wrap"><i class="fa-solid fa-percent"></i></span>
                <span class="label">Aplicar Descuento omitidos</span>
            </button>
            <button class="menu-btn" onclick="cargarApp(this, 'frame3', 'https://lautinax.github.io/laburo/')">
                <span class="icon-wrap"><i class="fa-solid fa-sack-dollar"></i></span>
                <span class="label">Detalles de pedidos sin procesar</span>
            </button>
            <button class="menu-btn" onclick="cargarApp(this, 'frame4', 'https://lautinax.github.io/pedido-en-preparacion/')">
                <span class="icon-wrap"><i class="fa-solid fa-truck-ramp-box"></i></span>
                <span class="label">Reporte de pendientes</span>
            </button>
            <button class="menu-btn" onclick="cargarApp(this, 'frame5', 'https://lautinax.github.io/retiros-Andreani-/')">
                <span class="icon-wrap"><i class="fa-solid fa-truck-moving"></i></span>
                <span class="label">Retiros Andreani</span>
            </button>
        </div>

        <div class="sidebar-footer">
            <span>Panel Logístico v2.3</span>
            <span class="ver-tag">ONLINE</span>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <div class="topbar">
            <div class="topbar-left">
                <button class="hamburger" id="hamburger" onclick="toggleSidebar(true)">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div>
                    <div class="topbar-title" id="topbarTitle">Para enviar a back office</div>
                    <div class="topbar-sub">Vista activa en el panel central</div>
                </div>
            </div>
            <div class="topbar-right">
                <button class="refresh-btn" id="refreshBtn" onclick="recargarActual()">
                    <i class="fa-solid fa-rotate-right"></i> Actualizar
                </button>
            </div>
        </div>

        <div class="frame-area">
            <div class="frame-card">
                <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
                <div class="loading-overlay show" id="loadingOverlay">
                    <div class="spinner"></div>
                    <div class="loading-text">Cargando módulo...</div>
                </div>
                
                <iframe id="frame1" class="app-frame active" data-src="https://lautinax.github.io/va05/" src="https://lautinax.github.io/va05/"></iframe>
                <iframe id="frame2" class="app-frame" data-src="https://lautinax.github.io/descuento/"></iframe>
                <iframe id="frame3" class="app-frame" data-src="https://lautinax.github.io/laburo/"></iframe>
                <iframe id="frame4" class="app-frame" data-src="https://lautinax.github.io/pedido-en-preparacion/"></iframe>
                <iframe id="frame5" class="app-frame" data-src="https://lautinax.github.io/retiros-Andreani-/"></iframe>
            </div>
        </div>
    </div>

    <!-- BOTÓN FLOTANTE TO-DO -->
    <button class="floating-notes-trigger" onclick="toggleNotes(true)" title="Tareas To-Do">
        <i class="fa-solid fa-list-check"></i>
    </button>

    <!-- DRAWER MICROSOFT TO-DO CON ALARMA Y NOTIFICACIÓN -->
    <div class="notes-drawer" id="notesDrawer">
        <div class="todo-drawer-header">
            <div class="todo-header-top">
                <h3><i class="fa-solid fa-circle-check" style="color: var(--accent);"></i> Microsoft To Do</h3>
                <button class="close-notes-btn" onclick="toggleNotes(false)"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="todo-nav-tabs">
                <button class="todo-tab-btn active" id="tabAll" onclick="cambiarFiltro('all')"><i class="fa-solid fa-sun"></i> Mi día</button>
                <button class="todo-tab-btn" id="tabImportant" onclick="cambiarFiltro('important')"><i class="fa-solid fa-star"></i> Importantes</button>
            </div>
        </div>

        <div class="notes-body">
            <div class="todo-add-box">
                <div class="todo-input-row">
                    <i class="fa-solid fa-plus" style="color: var(--accent); font-size: 13px;"></i>
                    <input type="text" class="todo-main-input" id="todoInput" placeholder="Agregar una tarea..." onkeypress="handleTaskKey(event)">
                    <button class="todo-add-btn-mini" onclick="agregarTarea()"><i class="fa-solid fa-arrow-right"></i></button>
                </div>
                <div class="todo-meta-options">
                    <span style="font-size: 11px; color: var(--text-muted);"><i class="fa-regular fa-clock"></i> Recordatorio:</span>
                    <input type="datetime-local" class="todo-meta-input" id="todoReminderInput">
                </div>
            </div>

            <div class="todo-list-container" id="todoListContainer"></div>
        </div>
    </div>

    <script>
        let frameActualId = 'frame1';
        let tareasMicrosoft = [];
        let filtroActual = 'all';

        document.addEventListener('DOMContentLoaded', () => {
            const guardadas = localStorage.getItem('sap_microsoft_todos_notif_v2');
            if (guardadas) {
                try { tareasMicrosoft = JSON.parse(guardadas); } catch(e) { tareasMicrosoft = []; }
            }
            renderizarTareas();

            if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
                Notification.requestPermission();
            }

            // Motor de verificación cada 10 segundos
            setInterval(verificarAlarmasVencidas, 10000);

            document.querySelectorAll('.app-frame').forEach(frame => {
                frame.addEventListener('load', () => { setTimeout(ocultarCarga, 250); });
            });
        });

        function guardarStorage() {
            localStorage.setItem('sap_microsoft_todos_notif_v2', JSON.stringify(tareasMicrosoft));
        }

        function cambiarFiltro(filtro) {
            filtroActual = filtro;
            document.getElementById('tabAll').classList.toggle('active', filtro === 'all');
            document.getElementById('tabImportant').classList.toggle('active', filtro === 'important');
            renderizarTareas();
        }

        function handleTaskKey(e) {
            if (e.key === 'Enter') agregarTarea();
        }

        function agregarTarea() {
            const input = document.getElementById('todoInput');
            const reminderInput = document.getElementById('todoReminderInput');
            const texto = input.value.trim();
            if (!texto) return;

            const nueva = {
                id: Date.now(),
                text: texto,
                completed: false,
                important: filtroActual === 'important',
                reminder: reminderInput.value || null,
                notified: false
            };

            tareasMicrosoft.unshift(nueva);
            input.value = '';
            reminderInput.value = '';
            guardarStorage();
            renderizarTareas();
        }

        function alternarCompletada(id) {
            tareasMicrosoft = tareasMicrosoft.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
            guardarStorage();
            renderizarTareas();
        }

        function alternarImportante(id) {
            tareasMicrosoft = tareasMicrosoft.map(t => t.id === id ? { ...t, important: !t.important } : t);
            guardarStorage();
            renderizarTareas();
        }

        function eliminarTarea(id) {
            tareasMicrosoft = tareasMicrosoft.filter(t => t.id !== id);
            guardarStorage();
            renderizarTareas();
        }

        function verificarAlarmasVencidas() {
            const ahora = new Date();
            let huboCambios = false;

            tareasMicrosoft.forEach(t => {
                if (t.reminder && !t.completed && !t.notified) {
                    const fechaRem = new Date(t.reminder);
                    if (ahora >= fechaRem) {
                        t.notified = true;
                        huboCambios = true;
                        
                        // Muestra el banner tipo mensaje flotante superior con opciones
                        mostrarBannerAlerta(t.id, t.text);

                        if ("Notification" in window && Notification.permission === "granted") {
                            new Notification("Tarea Vencida", {
                                body: t.text,
                                icon: "favicon.png"
                            });
                        }
                    }
                }
            });

            if (huboCambios) {
                guardarStorage();
                renderizarTareas();
            }
        }

        // Genera el banner estilo mensaje arriba con los botones requeridos ("Borrar" y "Cerrar")
        function mostrarBannerAlerta(taskId, textoTarea) {
            const container = document.getElementById('topNotificationContainer');
            
            const banner = document.createElement('div');
            banner.className = 'banner-alert';
            banner.id = `banner-${taskId}`;
            banner.innerHTML = `
                <div class="banner-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
                <div class="banner-content">
                    <span class="banner-title">¡Tarea Vencida!</span>
                    <span class="banner-msg">${textoTarea}</span>
                </div>
                <div class="banner-actions">
                    <button class="banner-btn-action delete-btn" onclick="borrarDesdeBanner(${taskId})" title="Borrar tarea definitivamente">
                        <i class="fa-solid fa-trash-can"></i> Borrar
                    </button>
                    <button class="banner-btn-action" onclick="cerrarBanner(${taskId})" title="Cerrar esta notificación">
                        <i class="fa-solid fa-xmark"></i> Cerrar
                    </button>
                </div>
            `;
            container.appendChild(banner);
        }

        // Acción del botón "Cerrar" en el banner (solo oculta la notificación visual)
        function cerrarBanner(taskId) {
            const banner = document.getElementById(`banner-${taskId}`);
            if (banner) {
                banner.classList.add('fade-out');
                setTimeout(() => banner.remove(), 300);
            }
        }

        // Acción del botón "Borrar" en el banner (elimina la tarea por completo y oculta el banner)
        function borrarDesdeBanner(taskId) {
            eliminarTarea(taskId);
            cerrarBanner(taskId);
        }

        function renderizarTareas() {
            const container = document.getElementById('todoListContainer');
            container.innerHTML = '';

            let listaFiltrada = tareasMicrosoft;
            if (filtroActual === 'important') {
                listaFiltrada = tareasMicrosoft.filter(t => t.important);
            }

            if (listaFiltrada.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; color: var(--text-muted); margin-top: 35px; font-size: 12.5px;">
                        <i class="fa-regular fa-face-smile" style="font-size: 22px; margin-bottom: 8px; display: block; color: var(--accent);"></i>
                        No hay tareas en esta vista.
                    </div>`;
                return;
            }

            listaFiltrada.forEach(t => {
                const item = document.createElement('div');
                item.className = `todo-task-item ${t.completed ? 'completed' : ''} ${t.important ? 'important' : ''}`;
                
                let fechaFormateada = '';
                let esAlarmaVencida = false;
                if (t.reminder) {
                    const fechaRem = new Date(t.reminder);
                    fechaFormateada = fechaRem.toLocaleString('es-ES', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                    if (new Date() >= fechaRem && !t.completed) {
                        esAlarmaVencida = true;
                    }
                }

                item.innerHTML = `
                    <div class="todo-checkbox-custom" onclick="alternarCompletada(${t.id})">
                        <i class="fa-solid fa-check"></i>
                    </div>
                    <div class="todo-content-box" onclick="alternarCompletada(${t.id})">
                        <span class="todo-text-span">${t.text}</span>
                        ${t.reminder ? `
                            <div class="todo-task-badges">
                                <span class="task-badge ${esAlarmaVencida ? 'alarm-due' : ''}">
                                    <i class="fa-regular fa-bell"></i> ${fechaFormateada} ${esAlarmaVencida ? '• ¡Vencido!' : ''}
                                </span>
                            </div>` : ''}
                    </div>
                    <div class="todo-task-actions">
                        <button class="todo-action-icon star ${t.important ? 'active' : ''}" onclick="alternarImportante(${t.id})" title="Marcar como importante">
                            <i class="${t.important ? 'fa-solid' : 'fa-regular'} fa-star"></i>
                        </button>
                        <button class="todo-action-icon delete" onclick="eliminarTarea(${t.id})" title="Eliminar">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function cargarApp(boton, frameId, url) {
            frameActualId = frameId;
            const frame = document.getElementById(frameId);

            if (!frame.src && frame.getAttribute('data-src')) {
                mostrarCarga();
                frame.src = frame.getAttribute('data-src');
            } else {
                mostrarCarga();
                setTimeout(ocultarCarga, 150);
            }

            document.querySelectorAll('.app-frame').forEach(f => f.classList.remove('active'));
            frame.classList.add('active');

            const botones = document.querySelectorAll('.menu-btn');
            botones.forEach(btn => btn.classList.remove('active'));
            boton.classList.add('active');

            document.getElementById('topbarTitle').textContent = boton.querySelector('.label').textContent;

            if (window.innerWidth <= 880) toggleSidebar(false);
        }

        function mostrarCarga() {
            const overlay = document.getElementById('loadingOverlay');
            const bar = document.getElementById('progressBar');
            overlay.classList.add('show');
            bar.classList.remove('loading');
            void bar.offsetWidth; 
            bar.classList.add('loading');
        }

        function ocultarCarga() {
            document.getElementById('loadingOverlay').classList.remove('show');
        }

        function recargarActual() {
            const btn = document.getElementById('refreshBtn');
            btn.classList.add('spinning');
            mostrarCarga();
            const frameActivo = document.getElementById(frameActualId);
            frameActivo.src = frameActivo.src;
            setTimeout(() => btn.classList.remove('spinning'), 650);
        }

        function toggleSidebar(open) {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('backdrop');
            if (open) {
                sidebar.classList.add('open');
                backdrop.classList.add('show');
            } else {
                sidebar.classList.remove('open');
                if(!document.getElementById('notesDrawer').classList.contains('open')) backdrop.classList.remove('show');
            }
        }

        function toggleNotes(open) {
            const drawer = document.getElementById('notesDrawer');
            const backdrop = document.getElementById('backdrop');
            if (open) {
                drawer.classList.add('open');
                backdrop.classList.add('show');
            } else {
                drawer.classList.remove('open');
                if(!document.getElementById('sidebar').classList.contains('open')) backdrop.classList.remove('show');
            }
        }

        function cerrarTodo() {
            toggleSidebar(false);
            toggleNotes(false);
        }
    </script>
</body>
</html>
